[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takeoff-pinn"
version = "2.1.0.dev0"
description = "Physics-informed neural network and output-error identification of UAV takeoff ground roll"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Christos Vakoulis" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
takeoff-pinn = "takeoff_pinn.run:main"

[tool.setuptools]
packages = ["takeoff_pinn"]

# pytest settings live in pytest.ini (kept for the existing workflow).
